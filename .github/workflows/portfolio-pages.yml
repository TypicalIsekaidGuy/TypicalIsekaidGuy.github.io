name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/portfolio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Для репозитория <user>.github.io сайт лежит в корне (base-href "/"),
      # для project pages — в подпапке /<repo>/
      - name: Compute base href
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter build web --release --base-href "${{ steps.base.outputs.href }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
